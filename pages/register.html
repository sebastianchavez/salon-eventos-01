<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro · Aurum·Salón</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { gold: { DEFAULT: '#c9a55c', light: '#e6c887', dark: '#8a7236' }, ink: { DEFAULT: '#0f0f10', alt: '#1a1a1c', soft: '#242427', elev: '#2a2a2d' } }, fontFamily: { serif: ['Playfair Display', 'Georgia', 'serif'], sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <style>
    .auth-bg {
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(15,15,16,0.95), rgba(15,15,16,0.85)),
        url('https://images.unsplash.com/photo-1464366400600-7168b8af9bc3?w=1920&q=80') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body class="bg-base text-text">
  <main class="auth-bg">
    <div class="w-full max-w-md">
      <a href="../index.html" class="brand-mark justify-center mb-8">
        <i data-lucide="crown" class="w-7 h-7 text-gold"></i>
        <span>Aurum<span>·Salón</span></span>
      </a>

      <div class="card-glass p-8 fade-in">
        <div class="text-center mb-6">
          <h1 class="font-serif text-3xl font-bold mb-2">Crear cuenta</h1>
          <p class="text-sm text-muted">Únete y reserva tu próximo evento</p>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label class="form-label">Nombre completo</label>
            <input type="text" id="name" class="input-elegant" placeholder="Juan Pérez" required />
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Teléfono</label>
            <input type="tel" id="phone" class="input-elegant" placeholder="+56 9 9988 8777" required />
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="input-elegant" placeholder="tu@email.com" required />
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Contraseña</label>
            <div class="relative">
              <input type="password" id="password" class="input-elegant pr-10" placeholder="Mínimo 6 caracteres" required />
              <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-gold" onclick="togglePassword('password', this)">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="mt-2">
              <div class="progress-bar">
                <div class="progress-fill" id="strengthBar" style="width: 0%;"></div>
              </div>
              <p class="text-xs text-muted mt-1" id="strengthLabel"></p>
            </div>
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Confirmar contraseña</label>
            <div class="relative">
              <input type="password" id="confirmPassword" class="input-elegant pr-10" placeholder="Repite tu contraseña" required />
              <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-gold" onclick="togglePassword('confirmPassword', this)">
                <i data-lucide="eye" class="w-4 h-4"></i>
              </button>
            </div>
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="flex items-start gap-2 text-sm cursor-pointer">
              <input type="checkbox" id="acceptTerms" class="checkbox-gold mt-1" />
              <span class="text-muted leading-snug">Acepto los <a href="terms.html" target="_blank" class="text-gold hover:underline">términos y condiciones</a> y la <a href="privacy.html" target="_blank" class="text-gold hover:underline">política de privacidad</a></span>
            </label>
            <div class="form-error"></div>
          </div>

          <button type="submit" class="btn btn-primary w-full !py-3">
            <i data-lucide="user-plus" class="w-4 h-4"></i>
            Crear cuenta
          </button>
        </form>

        <div class="divider-gold my-6"></div>

        <p class="text-center text-sm text-muted">
          ¿Ya tienes cuenta? <a href="login.html" class="text-gold hover:text-gold-light font-semibold">Inicia sesión</a>
        </p>
      </div>
    </div>
  </main>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const isPwd = input.type === 'password';
      input.type = isPwd ? 'text' : 'password';
      btn.innerHTML = `<i data-lucide="${isPwd ? 'eye-off' : 'eye'}" class="w-4 h-4"></i>`;
      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    function updatePasswordStrength() {
      const pwd = document.getElementById('password').value;
      const strength = getPasswordStrength(pwd);
      const bar = document.getElementById('strengthBar');
      const label = document.getElementById('strengthLabel');
      const pct = (strength.score / 5) * 100;
      bar.style.width = pct + '%';
      bar.style.background = strength.score <= 2 ? 'var(--color-danger)' : strength.score <= 3 ? 'var(--color-warning)' : 'var(--color-success)';
      label.textContent = strength.label;
      label.style.color = strength.score <= 2 ? 'var(--color-danger)' : strength.score <= 3 ? 'var(--color-warning)' : 'var(--color-success)';
    }

    document.addEventListener('DOMContentLoaded', () => {
      seedData();
      document.getElementById('password').addEventListener('input', updatePasswordStrength);

      document.getElementById('registerForm').addEventListener('submit', (e) => {
        e.preventDefault();
        clearErrors(e.target);

        const data = {
          name: document.getElementById('name').value,
          phone: document.getElementById('phone').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          acceptTerms: document.getElementById('acceptTerms').checked
        };

        if (data.password !== document.getElementById('confirmPassword').value) {
          setFieldError(document.getElementById('confirmPassword').closest('.form-group'), 'Las contraseñas no coinciden');
          return;
        }

        const result = registerUser(data);
        if (result.ok) {
          showToast('¡Cuenta creada con éxito!', 'success', 1500);
          setTimeout(() => { window.location.href = 'login.html?registered=1'; }, 800);
        } else {
          showToast(result.error, 'error');
        }
      });

      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
</body>
</html>
