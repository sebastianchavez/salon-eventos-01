<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nueva contraseña · Aurum·Salón</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { gold: { DEFAULT: '#c9a55c', light: '#e6c887', dark: '#8a7236' }, ink: { DEFAULT: '#0f0f10', alt: '#1a1a1c', soft: '#242427', elev: '#2a2a2d' } }, fontFamily: { serif: ['Playfair Display', 'Georgia', 'serif'], sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <style>
    .auth-bg {
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(15,15,16,0.95), rgba(15,15,16,0.85)),
        url('https://images.unsplash.com/photo-1465495976277-4387d4b0b4c6?w=1920&q=80') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body class="bg-base text-text">
  <main class="auth-bg">
    <div class="w-full max-w-md">
      <a href="../index.html" class="brand-mark justify-center mb-8">
        <i data-lucide="crown" class="w-7 h-7 text-gold"></i>
        <span>Aurum<span>·Salón</span></span>
      </a>

      <div class="card-glass p-8 fade-in">
        <div class="text-center mb-6">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-full mb-4" style="background: rgba(201,165,92,0.1);">
            <i data-lucide="lock" class="w-8 h-8 text-gold"></i>
          </div>
          <h1 class="font-serif text-3xl font-bold mb-2">Nueva contraseña</h1>
          <p class="text-sm text-muted">Crea una contraseña segura para tu cuenta.</p>
        </div>

        <form id="resetForm">
          <div class="form-group">
            <label class="form-label">Nueva contraseña</label>
            <input type="password" id="password" class="input-elegant" placeholder="Mínimo 6 caracteres" required />
            <div class="mt-2">
              <div class="progress-bar">
                <div class="progress-fill" id="strengthBar" style="width: 0%;"></div>
              </div>
              <p class="text-xs text-muted mt-1" id="strengthLabel"></p>
            </div>
            <div class="form-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label">Confirmar contraseña</label>
            <input type="password" id="confirmPassword" class="input-elegant" placeholder="Repite tu contraseña" required />
            <div class="form-error"></div>
          </div>

          <button type="submit" class="btn btn-primary w-full !py-3">
            <i data-lucide="check" class="w-4 h-4"></i>
            Actualizar contraseña
          </button>
        </form>

        <div class="divider-gold my-6"></div>

        <p class="text-center text-sm text-muted">
          <a href="login.html" class="text-gold hover:text-gold-light inline-flex items-center gap-1">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver a iniciar sesión
          </a>
        </p>
      </div>
    </div>
  </main>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    function updatePasswordStrength() {
      const pwd = document.getElementById('password').value;
      const strength = getPasswordStrength(pwd);
      const bar = document.getElementById('strengthBar');
      const label = document.getElementById('strengthLabel');
      const pct = (strength.score / 5) * 100;
      bar.style.width = pct + '%';
      bar.style.background = strength.score <= 2 ? 'var(--color-danger)' : strength.score <= 3 ? 'var(--color-warning)' : 'var(--color-success)';
      label.textContent = strength.label;
      label.style.color = strength.score <= 2 ? 'var(--color-danger)' : strength.score <= 3 ? 'var(--color-warning)' : 'var(--color-success)';
    }

    document.addEventListener('DOMContentLoaded', () => {
      seedData();
      document.getElementById('password').addEventListener('input', updatePasswordStrength);

      document.getElementById('resetForm').addEventListener('submit', (e) => {
        e.preventDefault();
        clearErrors(e.target);

        const email = localStorage.getItem('salon_resetEmail');
        if (!email) {
          showToast('Sesión de recuperación inválida', 'error');
          setTimeout(() => { window.location.href = 'forgot-password.html'; }, 800);
          return;
        }

        const password = document.getElementById('password').value;
        const confirm = document.getElementById('confirmPassword').value;

        if (password !== confirm) {
          setFieldError(document.getElementById('confirmPassword').closest('.form-group'), 'Las contraseñas no coinciden');
          return;
        }

        const result = resetPasswordByEmail(email, password);
        if (result.ok) {
          localStorage.removeItem('salon_resetEmail');
          showToast('¡Contraseña actualizada!', 'success', 1500);
          setTimeout(() => { window.location.href = 'login.html?reset=1'; }, 800);
        } else {
          showToast(result.error, 'error');
        }
      });

      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
</body>
</html>
