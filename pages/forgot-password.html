<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar contraseña · Aurum·Salón</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { gold: { DEFAULT: '#c9a55c', light: '#e6c887', dark: '#8a7236' }, ink: { DEFAULT: '#0f0f10', alt: '#1a1a1c', soft: '#242427', elev: '#2a2a2d' } }, fontFamily: { serif: ['Playfair Display', 'Georgia', 'serif'], sans: ['Inter', 'system-ui', 'sans-serif'] } } }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <style>
    .auth-bg {
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(15,15,16,0.95), rgba(15,15,16,0.85)),
        url('https://images.unsplash.com/photo-1519741497674-611481863552?w=1920&q=80') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
  </style>
</head>
<body class="bg-base text-text">
  <main class="auth-bg">
    <div class="w-full max-w-md">
      <a href="../index.html" class="brand-mark justify-center mb-8">
        <i data-lucide="crown" class="w-7 h-7 text-gold"></i>
        <span>Aurum<span>·Salón</span></span>
      </a>

      <div class="card-glass p-8 fade-in" id="forgotCard">
        <div class="text-center mb-6">
          <div class="inline-flex items-center justify-center w-16 h-16 rounded-full mb-4" style="background: rgba(201,165,92,0.1);">
            <i data-lucide="key-round" class="w-8 h-8 text-gold"></i>
          </div>
          <h1 class="font-serif text-3xl font-bold mb-2">¿Olvidaste tu contraseña?</h1>
          <p class="text-sm text-muted">Ingresa tu email y te enviaremos un enlace para restablecerla.</p>
        </div>

        <form id="forgotForm">
          <div class="form-group">
            <label class="form-label">Correo electrónico</label>
            <input type="email" id="email" class="input-elegant" placeholder="tu@email.com" required />
            <div class="form-error"></div>
          </div>

          <button type="submit" class="btn btn-primary w-full !py-3">
            <i data-lucide="send" class="w-4 h-4"></i>
            Enviar enlace de recuperación
          </button>
        </form>

        <div class="divider-gold my-6"></div>

        <p class="text-center text-sm text-muted">
          <a href="login.html" class="text-gold hover:text-gold-light inline-flex items-center gap-1">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver a iniciar sesión
          </a>
        </p>
      </div>
    </div>
  </main>

  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      seedData();

      document.getElementById('forgotForm').addEventListener('submit', (e) => {
        e.preventDefault();
        clearErrors(e.target);
        const email = document.getElementById('email').value;

        if (!validateEmail(email)) {
          setFieldError(document.getElementById('email').closest('.form-group'), 'Email inválido');
          return;
        }

        const user = findUserByEmail(email);
        if (!user) {
          setFieldError(document.getElementById('email').closest('.form-group'), 'No existe una cuenta con este correo');
          return;
        }

        localStorage.setItem('salon_resetEmail', email);

        const card = document.getElementById('forgotCard');
        card.innerHTML = `
          <div class="text-center py-4">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-full mb-4 scale-in" style="background: rgba(74, 222, 128, 0.15);">
              <i data-lucide="mail-check" class="w-8 h-8 text-green-400"></i>
            </div>
            <h2 class="font-serif text-2xl font-bold mb-2 fade-in">¡Enviado!</h2>
            <p class="text-sm text-muted mb-6 fade-in delay-1">Hemos enviado un enlace de recuperación a <strong class="text-gold">${email}</strong>. Revisa tu bandeja de entrada.</p>
            <div class="card p-4 mb-6 fade-in delay-2 text-left">
              <p class="text-xs text-muted mb-2"><strong class="text-gold">Modo demo:</strong></p>
              <a href="reset-password.html" class="btn btn-primary w-full !py-2 text-sm">
                <i data-lucide="key" class="w-4 h-4"></i>
                Restablecer contraseña ahora
              </a>
            </div>
            <a href="login.html" class="text-sm text-gold hover:text-gold-light">Volver a iniciar sesión</a>
          </div>
        `;
        if (typeof lucide !== 'undefined') lucide.createIcons();
      });

      if (typeof lucide !== 'undefined') lucide.createIcons();
    });
  </script>
</body>
</html>
